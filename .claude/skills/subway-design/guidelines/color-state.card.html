<!-- @dsCard group="Colors" viewport="700x120" name="Vault states" subtitle="live · pending · paused · halted — dot colours for feeds, keeper, queue" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-page);padding:18px;font:var(--type-body)}.row{display:flex;gap:26px;align-items:center}.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px 0 9px;border-radius:var(--r-pill);background:var(--bg-surface);border:1px solid var(--border-subtle);font:var(--type-body-sm);color:var(--text-body)}.dot{width:7px;height:7px;border-radius:50%}</style></head><body>
<div class="row">
<span class="pill"><span class="dot" style="background:var(--state-live)"></span>In range</span>
<span class="pill"><span class="dot" style="background:var(--state-pending)"></span>Queued for epoch 412</span>
<span class="pill"><span class="dot" style="background:var(--state-paused)"></span>Feed paused — corporate action</span>
<span class="pill"><span class="dot" style="background:var(--state-halted)"></span>Panic — exits open</span>
</div></body></html>
