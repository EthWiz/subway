<div class="row"><div class="c" style="box-shadow:var(--shadow-1)">shadow-1 rest</div><div class="c" style="box-shadow:var(--shadow-2)">shadow-2 hover</div><div class="c" style="box-shadow:var(--shadow-3)">shadow-3 modal</div><div class="c" style="box-shadow:var(--ring-focus)">focus ring</div></div></body></html>
