<!-- @dsCard group="Brand" viewport="700x150" name="Share naming — x vs h" subtitle="x = unhedged base vault (accent tile) · h = hedged wrapper (ink tile)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-page);padding:18px;font:var(--type-body)}.row{display:flex;gap:40px;align-items:center}.t{display:inline-flex;align-items:center;gap:12px}.tile{width:38px;height:38px;border-radius:var(--r-2);display:inline-flex;align-items:center;justify-content:center;font:var(--fw-semibold) 14px/1 var(--font-num)}.tk{font:var(--fw-medium) 20px/1.2 var(--font-num);color:var(--text-strong)}.sub{display:block;font:var(--type-body-sm);color:var(--text-muted)}</style></head><body>
<div class="row">
<span class="t"><span class="tile" style="background:var(--accent-tint);color:var(--accent-ink);border:1px solid color-mix(in oklab,var(--accent) 24%,transparent)">x</span><span><span class="tk">xNVDA</span><span class="sub">equity beta plus fees</span></span></span>
<span class="t"><span class="tile" style="background:var(--ink-0);color:var(--ink-inverse)">h</span><span><span class="tk">hNVDA</span><span class="sub">dollar-denominated, floor-priced</span></span></span>
</div></body></html>
