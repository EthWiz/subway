<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-page);padding:18px;font:var(--type-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.sw>div{width:104px}.chip{height:56px;border-radius:var(--r-2);border:1px solid var(--border-subtle)}.n{display:block;margin-top:6px;font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-strong)}.v{display:block;font:var(--type-num-sm);color:var(--text-muted)}</style></head><body><div class="sw"><div><div class="chip" style="background:#FFFFFF"></div><span class="n">surface</span><span class="v">#FFFFFF</span></div><div><div class="chip" style="background:#FBFAF7"></div><span class="n">page</span><span class="v">#FBFAF7</span></div><div><div class="chip" style="background:#F3F0E9"></div><span class="n">sunken</span><span class="v">#F3F0E9</span></div><div><div class="chip" style="background:#E8E3D8"></div><span class="n">active</span><span class="v">#E8E3D8</span></div><div><div class="chip" style="background:#EAE6DE"></div><span class="n">line-1</span><span class="v">#EAE6DE</span></div><div><div class="chip" style="background:#D9D5CC"></div><span class="n">line-2</span><span class="v">#D9D5CC</span></div></div></body></html>
